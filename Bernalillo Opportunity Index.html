<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bernalillo County Opportunity Index</title>
  <meta name="description" content="How Bernalillo County's 176 census tracts compare on income, housing, health, access and eviction pressure, with measured eviction filings and spatial cluster analysis.">
  <meta property="og:title" content="Bernalillo County Opportunity Index">
  <meta property="og:description" content="Tract-level map of opportunity and eviction filings in Bernalillo County, New Mexico.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // GitHub Pages lets browsers cache files for 10 min. A unique ?v= on every load
    // means a normal refresh always picks up the latest app code and data.
    window.BERN_V = Date.now();
    document.write('<link rel="stylesheet" href="app/styles.css?v=' + BERN_V + '">');
  </script>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script>
    document.write('<script src="app/layers.js?v=' + BERN_V + '"><\/script>');
    document.write('<script type="text/babel" src="app/app.jsx?v=' + BERN_V + '"><\/script>');
  </script>
  <script type="text/babel">
    (async () => {
      const get = (path) => fetch(path + '?v=' + window.BERN_V).then(r => { if (!r.ok) throw new Error(`${path} returned ${r.status}`); return r.json(); });
      const [tracts, commissionDistricts, summary] = await Promise.all([
        get('data/tracts.json'),
        get('data/commission_districts.json'),
        get('data/summary.json').catch(() => null)
      ]);
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<window.BernAppMain tracts={tracts} commissionDistricts={commissionDistricts} summary={summary} />);
    })().catch((err) => {
      document.getElementById('root').innerHTML = `<main class="error"><h1>The map data didn’t load</h1><p>${err.message}</p><p>If you opened this file directly, serve the folder instead: <code>python -m http.server 8000</code>, then open localhost:8000.</p></main>`;
      console.error(err);
    });
  </script>
</body>
</html>
